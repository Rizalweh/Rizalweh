<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="blueBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9FD4FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9FD4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellowBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE28A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE28A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurFx" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <!-- base background -->
  <rect width="1200" height="380" fill="#ffffff"/>

  <!-- moving colorful blur blobs, covering full banner like reference photo -->
  <circle cx="0" cy="0" r="260" fill="url(#blueBlob)" filter="url(#blurFx)">
    <animate attributeName="cx" values="0;120;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="0;100;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="260;320;260" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1200" cy="0" r="300" fill="url(#yellowBlob)" filter="url(#blurFx)">
    <animate attributeName="cx" values="1200;1080;1200" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="0;110;0" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="300;360;300" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="0" cy="380" r="280" fill="url(#yellowBlob)" filter="url(#blurFx)">
    <animate attributeName="cx" values="0;110;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="380;300;380" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="280;340;280" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1200" cy="380" r="280" fill="url(#blueBlob)" filter="url(#blurFx)">
    <animate attributeName="cx" values="1200;1090;1200" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="380;300;380" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="280;350;280" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- content group: fades in once -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.1s" fill="freeze"/>

    <text x="60" y="150" font-family="Verdana, Arial, sans-serif" font-weight="800" font-size="60">
      <tspan fill="#141414">Hey, I'm </tspan><tspan fill="#F2B301">Rizal Audi</tspan>
    </text>

    <!-- animated underline swoosh -->
    <path id="underline" d="M340,178 Q500,205 670,168" stroke="#F2B301" stroke-width="7"
          fill="none" stroke-linecap="round" stroke-dasharray="420" stroke-dashoffset="420">
      <animate attributeName="stroke-dashoffset" from="420" to="0" dur="1s" begin="0.9s" fill="freeze"/>
    </path>

    <text x="60" y="245" font-family="Verdana, Arial, sans-serif" font-size="23" fill="#222">
      <tspan>Software Engineering Student specializing in </tspan>
      <tspan font-weight="700">Multimedia &amp; Digital Content</tspan><tspan>.</tspan>
    </text>
    <text x="60" y="280" font-family="Verdana, Arial, sans-serif" font-size="23" fill="#222">
      <tspan>Passionate about </tspan>
      <tspan font-weight="700">videography</tspan><tspan>, </tspan>
      <tspan font-weight="700">video editing</tspan><tspan>, and </tspan>
      <tspan font-weight="700">creating</tspan><tspan> engaging visual media</tspan>
    </text>
  </g>
</svg>
