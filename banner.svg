<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="yellowBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE28A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE28A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9FD4FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9FD4FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurFx" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="380" fill="#ffffff"/>

  <!-- animated glow blobs -->
  <circle cx="980" cy="70" r="180" fill="url(#yellowBlob)" filter="url(#blurFx)">
    <animate attributeName="r" values="180;205;180" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="330" r="200" fill="url(#blueBlob)" filter="url(#blurFx)">
    <animate attributeName="r" values="200;225;200" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- content group: fades in once -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.1s" fill="freeze"/>

    <text x="60" y="150" font-family="Verdana, Arial, sans-serif" font-weight="800" font-size="60">
      <tspan fill="#141414">Hey, I'm </tspan><tspan fill="#F2B301">Rizal Audi</tspan>
    </text>

    <!-- animated underline swoosh -->
    <path id="underline" d="M340,178 Q500,205 670,168" stroke="#F2B301" stroke-width="7"
          fill="none" stroke-linecap="round" stroke-dasharray="420" stroke-dashoffset="420">
      <animate attributeName="stroke-dashoffset" from="420" to="0" dur="1s" begin="0.9s" fill="freeze"/>
    </path>

    <text x="60" y="245" font-family="Verdana, Arial, sans-serif" font-size="23" fill="#222">
      <tspan>Software Engineering Student specializing in </tspan>
      <tspan font-weight="700">Multimedia &amp; Digital Content</tspan><tspan>.</tspan>
    </text>
    <text x="60" y="280" font-family="Verdana, Arial, sans-serif" font-size="23" fill="#222">
      <tspan>Passionate about </tspan>
      <tspan font-weight="700">videography</tspan><tspan>, </tspan>
      <tspan font-weight="700">video editing</tspan><tspan>, and </tspan>
      <tspan font-weight="700">creating</tspan><tspan> engaging visual media</tspan>
    </text>
  </g>
</svg>
